name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "14742923"
          packages: ""

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Run checks and build debug APK
        run: ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug

      - name: Verify committed Room schema
        shell: bash
        run: |
          git diff --exit-code -- app/schemas
          if [[ -n "$(git status --porcelain --untracked-files=all -- app/schemas)" ]]; then
            git status --short -- app/schemas
            find app/schemas -type f -name "*.json" -print -exec sed -n "1,1200p" {} \;
            exit 1
          fi

  compose-ui-test:
    name: Compose UI test (managed emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "14742923"
          packages: ""

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Enable KVM access
        shell: bash
        run: |
          if [[ ! -e /dev/kvm ]]; then
            echo "/dev/kvm is unavailable on this runner"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Install emulator image
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "system-images;android-30;aosp_atd;x86"

      - name: Run Compose UI tests
        run: >-
          ./gradlew --no-daemon
          pixel2api30DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-ui-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

  server-workspace-e2e:
    name: Android UI against Django/PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "14742923"
          packages: ""

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Enable KVM access
        shell: bash
        run: |
          if [[ ! -e /dev/kvm ]]; then
            echo "/dev/kvm is unavailable on this runner"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Install emulator image
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "system-images;android-30;aosp_atd;x86"

      - name: Start real backend stack
        env:
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,10.0.2.2
        run: docker compose up --detach --build --wait --wait-timeout 120

      - name: Seed isolated E2E account
        run: >-
          docker compose exec -T
          -e ARTJOURNAL_ALLOW_E2E_SEED=true
          web python manage.py seed_android_e2e

      - name: Verify real API contract
        run: python3 backend/scripts/verify_android_e2e_api.py

      - name: Run server workspace UI E2E
        run: >-
          ./gradlew --no-daemon
          pixel2api30DebugAndroidTest
          -PARTJOURNAL_E2E_ENABLED=true
          -Pandroid.testInstrumentationRunnerArguments.class=com.ajuia.artjournal.ServerWorkspaceBackendE2ETest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Print backend logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-workspace-e2e-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop backend stack
        if: always()
        run: docker compose down --volumes --remove-orphans
